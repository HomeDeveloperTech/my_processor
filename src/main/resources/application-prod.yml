spring:
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST:brhtl01c01c1-dbvm02.fiserv.one}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:FICOCAT.fiserv.one}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.Oracle12cDialect
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

app:
  oracle:
    schema: ${ORACLE_SCHEMA:UAT_FICOIPB}

logging:
  level:
    root: warn
